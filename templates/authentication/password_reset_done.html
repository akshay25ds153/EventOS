<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sent | EventOS</title>
    <!-- Google Fonts (Inter) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <!-- Bootstrap 5 CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/forms.css' %}">
    <style>
        body.login-bg {
            background-color: #F8FAFC;
            background-image: 
                radial-gradient(at 0% 0%, rgba(219, 234, 254, 0.6) 0px, transparent 50%), 
                radial-gradient(at 50% 0%, rgba(238, 244, 255, 0.8) 0px, transparent 50%), 
                radial-gradient(at 100% 0%, rgba(219, 234, 254, 0.6) 0px, transparent 50%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(37, 99, 235, 0.06), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .login-logo {
            font-size: 2.25rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body class="login-bg">

    <div class="login-card p-4 p-md-5 text-center">
        <div class="login-logo text-success"><i class="bi bi-envelope-check-fill"></i></div>
        <h4 class="fw-bold text-dark mb-2">Check Your Inbox</h4>
        <p class="text-muted small mb-4">We have sent a link to reset your password to the email address provided. If it doesn't appear soon, please check your spam folder.</p>

        <div class="d-grid">
            <a href="{% url 'login' %}" class="btn btn-primary py-2 text-uppercase fw-semibold" style="letter-spacing: 0.05em;">
                Return to Sign In
            </a>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
