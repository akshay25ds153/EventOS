<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | EventOS</title>
    <!-- Google Fonts (Inter) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <!-- Bootstrap 5 CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/forms.css' %}">
    <style>
        body.login-bg {
            background-color: #F8FAFC;
            background-image: 
                radial-gradient(at 0% 0%, rgba(219, 234, 254, 0.6) 0px, transparent 50%), 
                radial-gradient(at 50% 0%, rgba(238, 244, 255, 0.8) 0px, transparent 50%), 
                radial-gradient(at 100% 0%, rgba(219, 234, 254, 0.6) 0px, transparent 50%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .login-card {
            max-width: 480px;
            width: 100%;
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(37, 99, 235, 0.06), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .login-logo {
            font-size: 2.25rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body class="login-bg">

    <div class="login-card p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="login-logo"><i class="bi bi-calendar-event-fill"></i></div>
            <h4 class="fw-bold text-dark mb-1">Create Account</h4>
            <p class="text-muted small">Sign up to participate and organize college events</p>
        </div>

        {% include 'base/messages.html' %}

        {% load crispy_forms_tags %}
        <form action="{% url 'register' %}" method="POST" novalidate>
            {% csrf_token %}
            
            {{ form|crispy }}

            <!-- Buttons -->
            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-primary py-2 text-uppercase fw-semibold" style="letter-spacing: 0.05em;">
                    <i class="bi bi-person-plus me-2"></i>Sign Up
                </button>
                <button type="reset" class="btn btn-outline-secondary py-2 text-uppercase fw-semibold" style="letter-spacing: 0.05em;">
                    Reset
                </button>
            </div>
        </form>

        <div class="text-center mt-4">
            <span class="text-muted small">Already have an account?</span> <a href="{% url 'login' %}" class="small text-decoration-none fw-medium">Sign In</a>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
