<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Event | EventOS</title>
    <!-- Google Fonts (Inter) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <!-- Bootstrap 5 CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .confirm-bg {
            background-color: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .confirm-card {
            max-width: 440px;
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            background-color: var(--card-bg);
        }
    </style>
</head>
<body class="confirm-bg">

    <div class="confirm-card p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="text-danger mb-3" style="font-size: 3rem;">
                <i class="bi bi-exclamation-triangle-fill"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">Delete Event</h4>
            <p class="text-muted small">Are you sure you want to delete this event?</p>
        </div>

        <div class="bg-light border rounded p-3 mb-4 text-center">
            <span class="d-block text-muted small fw-medium text-uppercase mb-1">Target Event</span>
            <strong class="text-dark fs-5">{{ event.name }}</strong>
            <span class="d-block text-muted mt-1" style="font-size: 0.75rem;"><i class="bi bi-geo-alt me-1"></i>{{ event.venue }}</span>
        </div>

        <p class="text-muted small text-center mb-4">
            Deleting this event will purge all registered member information (e.g. rosters, organizer sheets). This action is irreversible.
        </p>

        <form action="{% url 'delete_event' event.id %}" method="POST">
            {% csrf_token %}
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-danger py-2 fw-semibold text-uppercase" style="letter-spacing: 0.05em;">
                    Yes, Confirm Delete
                </button>
                <a href="{% url 'event_list' %}" class="btn btn-outline-secondary py-2 fw-semibold text-uppercase" style="letter-spacing: 0.05em;">
                    No, Cancel
                </a>
            </div>
        </form>
    </div>

    <!-- Bootstrap 5 Bundle JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
