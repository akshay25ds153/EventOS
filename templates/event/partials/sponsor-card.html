<div class="card border-0 rounded-4 shadow-sm bg-white p-4 mb-4">
    <h5 class="fw-extrabold text-dark mb-3"><i class="bi bi-gift-fill text-primary me-2"></i>Event Sponsors</h5>
    
    <div class="d-flex flex-column gap-3">
        {% for sponsor in event.sponsors.all %}
            <div class="d-flex align-items-center gap-3 p-3 rounded-4 border bg-light bg-opacity-25">
                {% if sponsor.logo %}
                    <img src="{{ sponsor.logo.url }}" class="rounded-3 border object-fit-contain shadow-sm bg-white" alt="{{ sponsor.name }}"
                         style="width: 50px; height: 50px; flex-shrink: 0;">
                {% else %}
                    <div class="rounded-3 border d-flex align-items-center justify-content-center bg-dark text-white" style="width: 50px; height: 50px; flex-shrink: 0;">
                        <i class="bi bi-building fs-5"></i>
                    </div>
                {% endif %}
                
                <div class="overflow-hidden">
                    <h6 class="fw-bold text-dark mb-0.5 text-truncate">{{ sponsor.name }}</h6>
                    {% if sponsor.website %}
                        <a href="{{ sponsor.website }}" target="_blank" class="text-primary extra-small text-decoration-none fw-semibold text-truncate d-block">
                            <i class="bi bi-box-arrow-up-right me-1"></i>Visit website
                        </a>
                    {% else %}
                        <span class="text-muted extra-small">Official Partner</span>
                    {% endif %}
                </div>
            </div>
        {% empty %}
            <div class="text-center py-4 text-muted border border-dashed rounded-4">
                <i class="bi bi-award fs-3 opacity-25 d-block mb-1"></i>
                <span class="extra-small">No sponsors linked to this event</span>
            </div>
        {% endfor %}
    </div>
</div>
