<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Server Error | EventOS</title>
    <!-- Google Fonts (Inter) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <!-- Bootstrap 5 CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .error-bg {
            background-color: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .error-card {
            max-width: 440px;
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            background-color: var(--card-bg);
        }
    </style>
</head>
<body class="error-bg">

    <div class="error-card p-4 p-md-5 text-center">
        <div class="text-danger mb-3" style="font-size: 4rem;">
            <i class="bi bi-shield-slash-fill"></i>
        </div>
        <h1 class="fw-bold text-dark mb-1">500</h1>
        <h4 class="fw-bold text-dark mb-3">Internal Server Error</h4>
        <p class="text-muted small mb-4">
            Oops! Something went wrong on our servers. Please try again later or contact the system administrator.
        </p>
        <div class="d-grid">
            <a href="{% url 'dashboard' %}" class="btn btn-primary py-2 text-uppercase fw-semibold" style="letter-spacing: 0.05em;">
                Go to Dashboard
            </a>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
